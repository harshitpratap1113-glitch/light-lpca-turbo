[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "light-lpca-turbo"
version = "2.0.0"
description = "100x Faster Sovereign Shadow Brain, BYOK Streaming Workspace & Parallel Multi-Engine Deep Research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
lpca-turbo = "lpca_turbo.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["lpca_turbo*"]

[tool.setuptools.package-data]
lpca_turbo = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
